<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 800 800"
   version="1.1"
   preserveAspectRatio="xMinYMin meet"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">

    <line
        x1="200"
        y1="50"
        x2="600"
        y2="50"
        style="stroke: #000" />
    <line
        x1="600"
        y1="50"
        x2="400"
        y2="400"
        style="stroke: #000" />
    <line
        x1="200"
        y1="50"
        x2="400"
        y2="400"
        style="stroke: #000" />

    <circle
        class="bullet-animate"
        style="fill: #189bd7"
        cx="200"
        cy="50"
        r="20" />
    <g
        class="bullet bullet-1"
        transform="translate(200,50)">
        <circle
            style="fill: #189bd7; stroke: #fff"
            cx="0"
            cy="0"
            r="20" />
        <text
            style="font: bold 25px sans-serif; fill: #fff"
            x="-7"
            y="8">
            1
        </text>
    </g>

    <circle
        class="bullet-animate"
        style="fill: #189bd7"
        cx="600"
        cy="50"
        r="20" />
    <g
        class="bullet bullet-2"
        transform="translate(600,50)">
        <circle
            style="fill: #189bd7; stroke: #fff"
            cx="0"
            cy="0"
            r="20" />
        <text
            style="font: bold 25px sans-serif; fill: #fff"
            x="-7"
            y="8">
            2
        </text>
    </g>

    <circle
        class="bullet-animate"
        style="fill: #189bd7"
        cx="400"
        cy="400"
        r="20" />
    <g
        class="bullet bullet-3"
        transform="translate(400,400)">
        <circle
            style="fill: #189bd7; stroke: #fff"
            cx="0"
            cy="0"
            r="20" />
        <text
            style="font: bold 25px sans-serif; fill: #fff"
            x="-7"
            y="8">
            3
        </text>
    </g>
</svg>
